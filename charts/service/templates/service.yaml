{{- $fullname := include "service.fullname" . -}}
{{- $suffixes := list "" -}}
{{- if eq .Values.strategy.type "canary" }}{{ $suffixes = append $suffixes "-canary" }}{{ end -}}
{{- if eq .Values.strategy.type "blueGreen" }}{{ $suffixes = append $suffixes "-preview" }}{{ end -}}
{{- range $suffixes }}
---
# Argo Rollouts injects a pod-template-hash selector into these services
# so each one points at the right ReplicaSet (stable / canary / preview).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}{{ . }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "service.selectorLabels" $ | nindent 4 }}
{{- end }}
