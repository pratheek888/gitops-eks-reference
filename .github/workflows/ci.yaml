name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7
  K8S_VERSION: 1.31.0

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml argocd environments charts/platform-app/values.yaml charts/service/values.yaml .github

  helm:
    name: Helm lint + render (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, preprod, prod]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Build umbrella chart dependencies
        run: helm dependency build charts/platform-app
      - name: Lint
        run: |
          helm lint charts/service
          helm lint charts/platform-app \
            -f charts/platform-app/values.yaml \
            -f environments/${{ matrix.env }}/values.yaml
      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template platform-app-${{ matrix.env }} charts/platform-app \
            --namespace platform-${{ matrix.env }} \
            -f charts/platform-app/values.yaml \
            -f environments/${{ matrix.env }}/values.yaml \
            > rendered/${{ matrix.env }}.yaml
          echo "### Rendered resources (${{ matrix.env }})" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^kind:' rendered/${{ matrix.env }}.yaml | sort | uniq -c >> "$GITHUB_STEP_SUMMARY"
      - name: Validate against Kubernetes + CRD schemas
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "${K8S_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/${{ matrix.env }}.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ matrix.env }}
          path: rendered/${{ matrix.env }}.yaml

  argocd-manifests:
    name: Validate Argo CD manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/eks
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  security-scan:
    name: IaC misconfiguration scan (Trivy)
    runs-on: ubuntu-latest
    needs: [helm, terraform]
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          # Report only; flip to "1" to make HIGH/CRITICAL findings block merges.
          exit-code: "0"
          format: table
